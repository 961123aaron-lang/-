<title>財金一丙 代辦板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: a class noticeboard. Sticky header, one countdown-led list, calendar as an alternate lens.
     Graphite paper; red/amber are semantic urgency colors only. */
  :root{
    --paper:#F4F4F2; --paper-2:#E9E9E6; --card:#FBFBFA;
    --ink:#161616; --ink-2:#4A4A48; --mute:#6B6B68; --line:rgba(22,22,22,.15);
    --acc:#161616; --acc-ink:#F4F4F2; --acc-soft:rgba(22,22,22,.06);
    --hot:#A63D2F; --hot-bg:rgba(166,61,47,.10);
    --warn:#8A6410; --warn-bg:rgba(176,126,20,.13);
    --ok:#3F6652; --ok-bg:rgba(63,102,82,.11);
    --font-sans:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121212; --paper-2:#1C1C1C; --card:#181818;
      --ink:#EDEDEB; --ink-2:#B8B8B5; --mute:#9C9C99; --line:rgba(237,237,235,.17);
      --acc:#EDEDEB; --acc-ink:#121212; --acc-soft:rgba(237,237,235,.08);
      --hot:#E2907F; --hot-bg:rgba(226,144,127,.14);
      --warn:#DDB45A; --warn-bg:rgba(221,180,90,.14);
      --ok:#86B79B; --ok-bg:rgba(134,183,155,.13);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#121212; --paper-2:#1C1C1C; --card:#181818;
    --ink:#EDEDEB; --ink-2:#B8B8B5; --mute:#9C9C99; --line:rgba(237,237,235,.17);
    --acc:#EDEDEB; --acc-ink:#121212; --acc-soft:rgba(237,237,235,.08);
    --hot:#E2907F; --hot-bg:rgba(226,144,127,.14);
    --warn:#DDB45A; --warn-bg:rgba(221,180,90,.14);
    --ok:#86B79B; --ok-bg:rgba(134,183,155,.13);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3,p,ul,ol{margin:0;}
  ul,ol{padding:0;list-style:none;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  button{border:0;background:none;cursor:pointer;}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px;}
  .wrap{max-width:860px;margin-inline:auto;padding-inline:max(16px,4vw);}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .kicker{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;color:var(--mute);font-weight:600;}

  /* header */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line);}
  .top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:8px;}
  .brand{font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px;margin-right:auto;}
  .brand i{width:20px;height:13px;border-radius:50%;background:var(--ink);display:block;}
  .pages{display:flex;gap:4px;flex-wrap:wrap;}
  .pg{padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2);border:1.5px solid transparent;}
  .pg[aria-current="page"]{background:var(--ink);color:var(--paper);}
  .pg:not([aria-current="page"]):hover{border-color:var(--line);}

  main{padding-block:28px 56px;}
  .banner{background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.6;margin-bottom:22px;}
  .banner b{color:var(--warn);}
  h2{font-size:clamp(24px,5vw,34px);font-weight:900;line-height:1.25;letter-spacing:-.01em;text-wrap:balance;}
  .lede{color:var(--ink-2);margin-top:6px;font-size:15px;}

  /* summary */
  .sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1.5px solid var(--ink);margin-top:20px;}
  .sum div{padding:14px 12px 14px 0;display:flex;flex-direction:column;}
  .sum div + div{padding-left:14px;border-left:1px solid var(--line);}
  .sum b{font-family:var(--font-mono);font-size:clamp(26px,6vw,38px);font-weight:600;line-height:1.1;}
  .sum span{font-size:13px;color:var(--ink-2);}
  .sum .hotn b{color:var(--hot);}

  /* toolbar */
  .tools{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;}
  .seg button{padding:7px 16px;font-weight:700;font-size:14px;}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
  .chip{padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink-2);}
  .chip[aria-pressed="true"]{border-color:var(--ink);background:var(--acc-soft);color:var(--ink);}
  .search{flex:1 1 180px;min-width:0;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);}
  .tgl{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2);}
  .tgl input{width:16px;height:16px;accent-color:var(--ink);}

  /* list */
  .group{margin-top:30px;}
  .ghead{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:1.5px solid var(--ink);}
  .ghead h3{font-size:18px;font-weight:900;}
  .ghead span{font-family:var(--font-mono);font-size:12.5px;color:var(--mute);}
  details.past > summary{cursor:pointer;list-style:none;}
  details.past > summary::-webkit-details-marker{display:none;}
  details.past > summary .ghead h3::after{content:" ＋";font-family:var(--font-mono);color:var(--mute);}
  details.past[open] > summary .ghead h3::after{content:" －";}
  .item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:4px 14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start;}
  .count{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;padding:8px 4px;background:var(--paper-2);text-align:center;min-height:64px;}
  .count b{font-family:var(--font-mono);font-size:26px;font-weight:600;line-height:1.1;}
  .count small{font-size:11.5px;color:var(--mute);line-height:1.3;}
  .item.hot .count{background:var(--hot-bg);color:var(--hot);}
  .item.hot .count small{color:var(--hot);}
  .item.warn .count{background:var(--warn-bg);color:var(--warn);}
  .item.warn .count small{color:var(--warn);}
  .item.past .count{opacity:.6;}
  .item.done .main{opacity:.5;}
  .item.done .main h4{text-decoration:line-through;}
  .main{min-width:0;display:flex;flex-direction:column;gap:4px;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .tag{font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);}
  .tag.type{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .tag.chg{background:var(--warn-bg);color:var(--warn);border-color:transparent;}
  .main h4{margin:0;font-size:17px;font-weight:900;line-height:1.4;}
  .meta{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 14px;}
  .meta .mono{font-size:13px;}
  .more{font-size:13px;color:var(--mute);}
  .more s{font-family:var(--font-mono);}
  .src{font-size:12.5px;color:var(--mute);}
  .ck{width:28px;height:28px;border-radius:8px;border:1.8px solid var(--ink);display:grid;place-items:center;background:var(--card);margin-top:2px;}
  .ck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff;}
  .ck svg{width:16px;height:16px;opacity:0;}
  .ck[aria-pressed="true"] svg{opacity:1;}
  @media (max-width:520px){.item{grid-template-columns:60px minmax(0,1fr) auto;gap:4px 10px;}}
  .empty{padding:28px 0;color:var(--mute);font-size:15px;}

  /* calendar */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-top:26px;}
  .calhead b{font-size:20px;font-weight:900;}
  .calhead button{padding:6px 14px;border:1.5px solid var(--line);border-radius:999px;font-weight:700;}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:12px;}
  .dow{font-family:var(--font-mono);font-size:12px;color:var(--mute);text-align:center;padding-bottom:4px;}
  .day{min-height:58px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:4px 5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;}
  .day.out{opacity:.35;}
  .day.today{border:2px solid var(--ink);}
  .day[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--ink);}
  .day .dn{font-family:var(--font-mono);font-size:12px;font-weight:600;}
  .dots{display:flex;gap:3px;flex-wrap:wrap;}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:block;}
  .dots i.hot{background:var(--hot);} .dots i.warn{background:var(--warn);}
  @media (max-width:520px){.day{min-height:50px;padding:3px;}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px;}
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend i{width:8px;height:8px;border-radius:50%;display:block;}

  /* notes + reports + form */
  .notes{display:flex;flex-direction:column;margin-top:24px;}
  .note{padding:20px 0;border-top:1.5px solid var(--ink);display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 24px;}
  .note:last-child{border-bottom:1.5px solid var(--ink);}
  .note h3{font-size:20px;font-weight:900;}
  .note ul{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--ink-2);}
  .note li{display:flex;gap:10px;}
  .note li::before{content:"";flex:none;width:12px;height:8px;border-radius:50%;background:var(--ink);margin-top:10px;}
  .note .stamp{grid-column:2;font-size:12.5px;color:var(--mute);}
  @media (max-width:560px){.note{grid-template-columns:minmax(0,1fr);}.note .stamp{grid-column:1;}}
  .rep{border:1.5px solid var(--ink);border-radius:12px;background:var(--card);padding:18px;margin-top:18px;display:flex;flex-direction:column;gap:10px;}
  .rep h3{font-size:19px;font-weight:900;}
  .rep dl{display:grid;grid-template-columns:84px minmax(0,1fr);gap:6px 12px;margin:0;font-size:14.5px;}
  .rep dt{color:var(--mute);font-weight:700;}
  .rep dd{margin:0;color:var(--ink-2);}
  .members{display:flex;gap:6px;flex-wrap:wrap;}
  .members span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--paper);}
  .members b{font-weight:700;margin-left:4px;color:var(--mute);font-size:12px;}
  .form{display:flex;flex-direction:column;gap:14px;margin-top:22px;max-width:560px;}
  .form label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px;}
  .form select,.form textarea,.form input[type=text]{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:400;}
  .form textarea{min-height:120px;resize:vertical;}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 22px;border-radius:999px;font-weight:700;background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);align-self:flex-start;}
  .btn.ghost{background:transparent;color:var(--ink);}
  .toast{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-weight:700;}
  .toast[hidden]{display:none;}

  /* gate */
  .gate{min-height:70vh;display:flex;align-items:center;}
  .gate .box{max-width:420px;display:flex;flex-direction:column;gap:14px;}
  .gate input{padding:12px 14px;border-radius:10px;border:1.5px solid var(--ink);background:var(--card);font-family:var(--font-mono);font-size:18px;letter-spacing:.1em;}
  .err{color:var(--hot);font-size:14px;font-weight:700;min-height:1.4em;}

  footer{border-top:1px solid var(--line);padding-block:24px 40px;font-size:12.5px;color:var(--mute);line-height:1.8;}
  footer b{color:var(--ink);}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><i></i>財金一丙 代辦板</div>
    <nav class="pages" id="pages" aria-label="頁面" hidden></nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">
    <b>免責聲明</b>　本站整理自老師公告與課堂紀錄，所有日期、範圍與規定以老師公告為準。若與公告不同，請以公告為準並回報更正。<br>
    財金一丙 林言樵 製
  </div>
</footer>

<script>
  /* ================= 設定與資料（正式版改由資料庫讀取） ================= */
  const CONFIG = { code: 'demo' };            // 範例解鎖碼，正式版會換掉

  const SUBJECTS = { econ:'經濟學', fin:'財務數學', acc:'會計', eng:'英文' };
  const TYPES = { exam:'考試', hw:'作業', report:'報告', quiz:'小考' };

  // off＝距今天幾天；upd＝幾天前更新；was＝改期前的 off。以下全部是範例資料。
  const EVENTS = [
    { id:'e1', subj:'acc',  type:'quiz',  title:'第 3 章 小考',            off:1,  time:'10:10', place:'教室', scope:'CH3 全部', weight:5,  note:'開書',              src:'老師課堂口頭公告', upd:2 },
    { id:'e2', subj:'fin',  type:'hw',    title:'習題 1：複利與終值',      off:2,  time:'23:59', place:'e-learning 上傳 PDF', scope:'講義 Ch1 習題 1–10', weight:3, note:'需附計算過程', src:'e-learning 公告', upd:5 },
    { id:'e3', subj:'econ', type:'exam',  title:'期中考',                  off:6,  time:'09:10', place:'原教室', scope:'Mankiw 第 1–7 章', weight:30, note:'含繪圖是非題', src:'老師投影片 W6', upd:1, was:13 },
    { id:'e4', subj:'eng',  type:'hw',    title:'U2 閱讀心得',             off:8,  time:'12:00', place:'e-learning', scope:'U2 Work 閱讀', weight:5, note:'', src:'e-learning 公告', upd:3 },
    { id:'e5', subj:'econ', type:'report',title:'小組報告：時事經濟分析',  off:13, time:'13:10', place:'課堂上台', scope:'自選一則近期新聞', weight:15, note:'每組 8 分鐘', src:'老師課堂口頭公告', upd:4 },
    { id:'e6', subj:'acc',  type:'exam',  title:'期中考',                  off:15, time:'10:10', place:'原教室', scope:'CH1–CH4', weight:25, note:'', src:'e-learning 公告', upd:6 },
    { id:'e7', subj:'fin',  type:'exam',  title:'期中考',                  off:16, time:'14:10', place:'原教室', scope:'Ch1–Ch6', weight:30, note:'可帶計算機', src:'老師投影片 W7', upd:6 },
    { id:'e8', subj:'eng',  type:'quiz',  title:'U1 單字小考',             off:-3, time:'09:10', place:'教室', scope:'U1 單字', weight:5, note:'', src:'e-learning 公告', upd:10 },
    { id:'e9', subj:'fin',  type:'hw',    title:'習題 0：預備數學',        off:-5, time:'23:59', place:'e-learning', scope:'', weight:2, note:'', src:'e-learning 公告', upd:12 }
  ];

  const NOTES = [
    { subj:'econ', upd:1, items:['機會成本問的是「我放棄了什麼」，時間也算成本','期中考會出供需圖判斷題，價格上限、價格下限都要會畫'] },
    { subj:'fin',  upd:3, items:['月複利的指數是「每年期數 × 年數」','計算機要會用 y^x 鍵，考試可以帶'] },
    { subj:'acc',  upd:2, items:['淨利 ＝ 收入 − 費用，股利不是費用','小考開書，但時間很短，先劃好章節重點'] },
    { subj:'eng',  upd:3, items:['U2 單字下週會抽考','閱讀心得需要 150 字以上'] }
  ];

  const REPORTS = [
    { subj:'econ', title:'時事經濟分析', off:13, time:'13:10', fmt:'簡報 PPT，8 分鐘上台', submit:'上課前把檔案上傳 e-learning',
      groups:[ { name:'第 1 組', members:[['範例同學甲','簡報'],['範例同學乙','找資料'],['範例同學丙','上台'],['範例同學丁','整合']] },
               { name:'第 2 組', members:[['範例同學戊','簡報'],['範例同學己','找資料'],['範例同學庚','上台']] } ] }
  ];

  /* ================= 工具函式 ================= */
  const $ = (s, r=document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  const today0 = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const WD = ['日','一','二','三','四','五','六'];
  const fmtDate = d => `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
  const dayKey = d => `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;

  const events = EVENTS.map(e => {
    const date = addDays(today0, e.off);
    const [h, m] = e.time.split(':').map(Number);
    return { ...e, date, days: e.off, was: e.was != null ? addDays(today0, e.was) : null, updDate: addDays(today0, -e.upd), h, m };
  }).sort((a, b) => a.date - b.date || (a.h*60+a.m) - (b.h*60+b.m));

  const urgency = e => e.days < 0 ? 'past' : e.days <= 3 ? 'hot' : e.days <= 7 ? 'warn' : 'calm';
  const countLabel = e => e.days < 0 ? ['已過', `${-e.days} 天`] : e.days === 0 ? ['今天', '0'] : ['還剩', `${e.days}`];

  /* ================= 狀態 ================= */
  const S = {
    unlocked: store.get('unlocked', false),
    page: 'schedule', view: 'list',
    subj: new Set(), type: new Set(), q: '', hideDone: false,
    done: new Set(store.get('done', [])),
    calMonth: new Date(today0.getFullYear(), today0.getMonth(), 1), calDay: null
  };

  /* ================= 畫面 ================= */
  const PAGES = [['schedule','待辦'],['notes','上課重點'],['reports','分組報告'],['submit','回報／補充']];

  function renderPages(){
    const nav = $('#pages');
    nav.hidden = !S.unlocked;
    nav.innerHTML = PAGES.map(([k, n]) => `<button class="pg" data-p="${k}" ${S.page === k ? 'aria-current="page"' : ''}>${n}</button>`).join('');
    nav.querySelectorAll('.pg').forEach(b => b.addEventListener('click', () => { S.page = b.dataset.p; render(); window.scrollTo(0, 0); }));
  }

  function render(){
    renderPages();
    const app = $('#app');
    if(!S.unlocked){ renderGate(app); return; }
    const banner = `<div class="banner"><b>雛形示意</b>　以下日期與內容都是範例資料，用來看版面和功能，不是真的課程資訊。</div>`;
    if(S.page === 'schedule') app.innerHTML = banner + scheduleHTML();
    else if(S.page === 'notes') app.innerHTML = banner + notesHTML();
    else if(S.page === 'reports') app.innerHTML = banner + reportsHTML();
    else app.innerHTML = banner + submitHTML();
    bind();
  }

  function renderGate(app){
    app.innerHTML = `<div class="gate"><form class="box" id="gate">
      <div class="kicker">財金一丙</div><h2>輸入解鎖碼</h2>
      <p class="lede">解鎖碼由班上同學私下提供。同一台裝置輸入一次就會記住。</p>
      <input id="code" type="text" autocomplete="off" aria-label="解鎖碼" placeholder="解鎖碼">
      <div class="err" id="err" role="alert"></div>
      <button class="btn" type="submit">進入</button>
      <p class="lede" style="font-size:13px">雛形示範用的解鎖碼：<span class="mono">demo</span></p>
    </form></div>`;
    $('#gate').addEventListener('submit', ev => {
      ev.preventDefault();
      if($('#code').value.trim() === CONFIG.code){ S.unlocked = true; store.set('unlocked', true); render(); }
      else $('#err').textContent = '解鎖碼不對，請再確認一次。';
    });
  }

  /* ---- 待辦 ---- */
  function filtered(){
    const q = S.q.trim().toLowerCase();
    return events.filter(e =>
      (!S.subj.size || S.subj.has(e.subj)) && (!S.type.size || S.type.has(e.type)) &&
      (!S.hideDone || !S.done.has(e.id)) &&
      (!q || [e.title, e.scope, e.note, e.place, SUBJECTS[e.subj]].join(' ').toLowerCase().includes(q)));
  }

  function itemHTML(e){
    const u = urgency(e), [lab, num] = countLabel(e), isDone = S.done.has(e.id);
    const chg = e.was ? `<span class="tag chg">已更動</span>` : '';
    const was = e.was ? `<div class="more">原定 <s>${fmtDate(e.was)}</s>，已改為 ${fmtDate(e.date)}</div>` : '';
    return `<li class="item ${u} ${isDone ? 'done' : ''}">
      <div class="count"><small>${lab}</small><b>${num}</b>${e.days > 0 ? '<small>天</small>' : ''}</div>
      <div class="main">
        <div class="tags"><span class="tag type">${TYPES[e.type]}</span><span class="tag">${SUBJECTS[e.subj]}</span>${chg}</div>
        <h4>${esc(e.title)}</h4>
        <div class="meta"><span class="mono">${fmtDate(e.date)} ${e.time}</span><span>${esc(e.place)}</span></div>
        ${e.scope ? `<div class="meta"><span>範圍：${esc(e.scope)}</span>${e.weight ? `<span>占 ${e.weight}%</span>` : ''}</div>` : ''}
        ${e.note ? `<div class="meta"><span>備註：${esc(e.note)}</span></div>` : ''}
        ${was}
        <div class="src">來源：${esc(e.src)}　最後更新 ${e.updDate.getMonth()+1}/${e.updDate.getDate()}</div>
      </div>
      <button class="ck" data-id="${e.id}" aria-pressed="${isDone}" aria-label="標記「${esc(e.title)}」已完成">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.5"/></svg>
      </button>
    </li>`;
  }

  function listHTML(list){
    const g = { hot:[], warn:[], calm:[], past:[] };
    list.forEach(e => g[urgency(e)].push(e));
    const sec = (title, arr) => arr.length ? `<section class="group"><div class="ghead"><h3>${title}</h3><span>${arr.length} 件</span></div><ul>${arr.map(itemHTML).join('')}</ul></section>` : '';
    let h = sec('3 天內', g.hot) + sec('7 天內', g.warn) + sec('之後', g.calm);
    if(g.past.length) h += `<details class="past group"><summary><div class="ghead"><h3>已過期</h3><span>${g.past.length} 件</span></div></summary><ul>${g.past.map(itemHTML).join('')}</ul></details>`;
    return h || '<p class="empty">沒有符合條件的事項。換個篩選看看。</p>';
  }

  function calHTML(list){
    const m = S.calMonth, first = new Date(m.getFullYear(), m.getMonth(), 1);
    const start = addDays(first, -first.getDay());
    const byDay = {};
    list.forEach(e => (byDay[dayKey(e.date)] ||= []).push(e));
    let cells = WD.map(w => `<div class="dow">${w}</div>`).join('');
    for(let i = 0; i < 42; i++){
      const d = addDays(start, i), k = dayKey(d), arr = byDay[k] || [];
      const dots = arr.map(e => `<i class="${urgency(e) === 'hot' ? 'hot' : urgency(e) === 'warn' ? 'warn' : ''}"></i>`).join('');
      cells += `<button class="day ${d.getMonth() !== m.getMonth() ? 'out' : ''} ${d.getTime() === today0.getTime() ? 'today' : ''}" data-k="${k}" aria-pressed="${S.calDay === k}" aria-label="${fmtDate(d)}，${arr.length} 件"><span class="dn">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
    }
    const sel = S.calDay ? (byDay[S.calDay] || []) : [];
    return `<div class="calhead"><button id="prev" aria-label="上個月">‹ 上月</button><b>${m.getFullYear()} 年 ${m.getMonth()+1} 月</b><button id="next" aria-label="下個月">下月 ›</button></div>
      <div class="calgrid">${cells}</div>
      <div class="legend"><span><i style="background:var(--hot)"></i>3 天內</span><span><i style="background:var(--warn)"></i>7 天內</span><span><i style="background:var(--mute)"></i>之後或已過</span></div>
      ${S.calDay ? `<section class="group"><div class="ghead"><h3>這一天</h3><span>${sel.length} 件</span></div>${sel.length ? `<ul>${sel.map(itemHTML).join('')}</ul>` : '<p class="empty">這天沒有事項。</p>'}</section>` : '<p class="empty">點日期可以看當天的事項。</p>'}`;
  }

  function scheduleHTML(){
    const upcoming = events.filter(e => e.days >= 0 && !S.done.has(e.id));
    const in7 = upcoming.filter(e => e.days <= 7).length, in3 = upcoming.filter(e => e.days <= 3).length;
    const list = filtered();
    const subjChips = Object.entries(SUBJECTS).map(([k, n]) => `<button class="chip" data-f="subj" data-v="${k}" aria-pressed="${S.subj.has(k)}">${n}</button>`).join('');
    const typeChips = Object.entries(TYPES).map(([k, n]) => `<button class="chip" data-f="type" data-v="${k}" aria-pressed="${S.type.has(k)}">${n}</button>`).join('');
    return `<div class="kicker">${today0.getFullYear()}/${today0.getMonth()+1}/${today0.getDate()}（${WD[today0.getDay()]}）</div>
      <h2>這週要交什麼、考什麼</h2>
      <p class="lede">依剩餘天數排序。勾選已完成，只會記在你自己的手機上。</p>
      <div class="sum"><div class="hotn"><b>${in3}</b><span>3 天內到期</span></div><div><b>${in7}</b><span>7 天內到期</span></div><div><b>${upcoming.length}</b><span>未完成的待辦</span></div></div>
      <div class="tools">
        <div class="row"><div class="seg" role="group" aria-label="檢視方式"><button data-view="list" aria-pressed="${S.view === 'list'}">倒數清單</button><button data-view="cal" aria-pressed="${S.view === 'cal'}">月曆</button></div>
          <input class="search" id="q" type="search" placeholder="搜尋標題、範圍、備註" value="${esc(S.q)}" aria-label="搜尋"></div>
        <div class="row" aria-label="科目篩選">${subjChips}</div>
        <div class="row" aria-label="類型篩選">${typeChips}<label class="tgl"><input type="checkbox" id="hd" ${S.hideDone ? 'checked' : ''}>隱藏已完成</label></div>
      </div>
      ${S.view === 'list' ? listHTML(list) : calHTML(list)}`;
  }

  /* ---- 上課重點 ---- */
  function notesHTML(){
    return `<div class="kicker">NOTES</div><h2>老師上課重點</h2>
      <p class="lede">每科最近一次的重點。同學補充的內容會先審核，通過後才會出現在這裡。</p>
      <div class="notes">${NOTES.map(n => {
        const d = addDays(today0, -n.upd);
        return `<article class="note"><h3>${SUBJECTS[n.subj]}</h3><ul>${n.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul><div class="stamp">最後更新 ${d.getMonth()+1}/${d.getDate()}　來源：課堂紀錄</div></article>`;
      }).join('')}</div>`;
  }

  /* ---- 分組報告 ---- */
  function reportsHTML(){
    return `<div class="kicker">GROUP REPORTS</div><h2>分組報告</h2>
      <p class="lede">每份報告的分組、分工和繳交方式放在這裡。</p>
      ${REPORTS.map(r => {
        const d = addDays(today0, r.off);
        return `<article class="rep"><div class="tags"><span class="tag type">報告</span><span class="tag">${SUBJECTS[r.subj]}</span></div>
          <h3>${esc(r.title)}</h3>
          <dl><dt>時間</dt><dd class="mono">${fmtDate(d)} ${r.time}</dd><dt>形式</dt><dd>${esc(r.fmt)}</dd><dt>繳交</dt><dd>${esc(r.submit)}</dd></dl>
          ${r.groups.map(g => `<div><b>${g.name}</b><div class="members" style="margin-top:6px">${g.members.map(([n, role]) => `<span>${esc(n)}<b>${esc(role)}</b></span>`).join('')}</div></div>`).join('')}
        </article>`;
      }).join('')}`;
  }

  /* ---- 回報／補充 ---- */
  function submitHTML(){
    const opts = events.filter(e => e.days >= 0).map(e => `<option value="${e.id}">${SUBJECTS[e.subj]}｜${esc(e.title)}（${fmtDate(e.date)}）</option>`).join('');
    return `<div class="kicker">FEEDBACK</div><h2>回報錯誤或補充</h2>
      <p class="lede">日期或內容有誤，或有上課重點想補充，在這裡寫。內容會先進審核區，每晚固定時間審核，有爭議的交給管理者決定。</p>
      <form class="form" id="sf">
        <label for="st">類型<select id="st"><option>回報有誤</option><option>補充事項</option><option>補充上課重點</option></select></label>
        <label for="se">相關事項（可不選）<select id="se"><option value="">不指定</option>${opts}</select></label>
        <label for="sc">內容<textarea id="sc" placeholder="例如：會計小考改到下週三，老師今天下課前說的"></textarea></label>
        <label for="ss">資料來源<input id="ss" type="text" placeholder="例如：老師課堂口頭公告、e-learning 公告"></label>
        <button class="btn" type="submit">送出</button>
        <div class="toast" id="tt" hidden></div>
      </form>`;
  }

  /* ================= 事件 ================= */
  function bind(){
    document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { S.view = b.dataset.view; render(); }));
    document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
      const set = S[b.dataset.f], v = b.dataset.v; set.has(v) ? set.delete(v) : set.add(v); render();
    }));
    const q = $('#q');
    if(q) q.addEventListener('input', () => { S.q = q.value; const pos = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); });
    const hd = $('#hd'); if(hd) hd.addEventListener('change', () => { S.hideDone = hd.checked; render(); });
    document.querySelectorAll('.ck').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.id; S.done.has(id) ? S.done.delete(id) : S.done.add(id);
      store.set('done', [...S.done]); render();
    }));
    document.querySelectorAll('.day').forEach(b => b.addEventListener('click', () => { S.calDay = S.calDay === b.dataset.k ? null : b.dataset.k; render(); }));
    const p = $('#prev'), n = $('#next');
    if(p) p.addEventListener('click', () => { S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() - 1, 1); S.calDay = null; render(); });
    if(n) n.addEventListener('click', () => { S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + 1, 1); S.calDay = null; render(); });
    const sf = $('#sf');
    if(sf) sf.addEventListener('submit', ev => {
      ev.preventDefault();
      const c = $('#sc').value.trim(), t = $('#tt');
      t.hidden = false;
      if(!c){ t.style.background = 'var(--hot-bg)'; t.style.color = 'var(--hot)'; t.textContent = '請先寫下內容。'; return; }
      t.style.background = ''; t.style.color = '';
      t.textContent = '雛形階段：投稿還沒有真的送出。正式版會進入審核區，每晚審核後更新。';
      $('#sc').value = ''; $('#ss').value = '';
    });
  }

  render();
</script>
